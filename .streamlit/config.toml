[client]
# 隐藏右上角 Deploy 与三横线菜单，避免遮挡语言切换
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
# 允许从 static/ 目录提供背景图（访问路径 /app/static/<file>）
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#EA580C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF6FF"
textColor = "#000000"
